name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Vite → dist)
        run: npm -w apps/web run build

      - name: Typecheck API
        run: npm -w apps/api run typecheck

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute ai-teacher-db --file=infra/d1/schema.sql

      - name: Deploy full-stack Worker (assets + API)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

# 需要配置的仓库 Secrets：
#   CLOUDFLARE_API_TOKEN  — 具备 Workers Scripts:Edit / D1:Edit / R2:Edit / KV:Edit 权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare 账户 ID
